<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório Semanal de Emendas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        /* 
         * REGRAS DE IMPRESSÃO (MODO CLARO E LAYOUT A4) 
         * Estas regras sobressaem qualquer configuração do Tailwind quando o Ctrl+P é acionado.
         */
        @media print {
            @page {
                size: A4 portrait; /* Força A4 Retrato */
                margin: 1.5cm;     /* Margem física do papel */
            }
            
            /* Força fundo branco e texto preto na raiz */
            html, body {
                background-color: #ffffff !important;
                color: #000000 !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
            }

            /* Esconde elementos de navegação/botões */
            .no-print { display: none !important; }
            
            /* Expandir a área de conteúdo para 100% do papel */
            main {
                max-width: 100% !important;
                width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
                box-shadow: none !important;
                border: none !important;
            }

            /* Controle de Quebra de Página (Evitar viúvas/órfãos) */
            /* A regra de ouro do print moderno: transformar tudo o que for flex container 
               onde a quebra acontece em block (ou inline-block), pois os navegadores IGNORAM
               break-inside: avoid se o pai for flexbox. */
            
            .print-break-avoid { 
                page-break-inside: avoid !important; 
                break-inside: avoid !important;
                display: block !important; 
            }
            
            .print-break-before { page-break-before: always !important; }
            
            /* Forçar as cores na impressão (Evitar que o navegador remova os fundos coloridos) */
            * {
                -webkit-print-color-adjust: exact !important;
                color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            /* Subscrição brutal de cores do Tailwind (Modo Escuro -> Modo Claro) */
            .bg-slate-900, .bg-slate-800 { background-color: #ffffff !important; border: 1px solid #e5e7eb !important; }
            .bg-slate-900\/50, .bg-slate-800\/60 { background-color: #f9fafb !important; border: 1px solid #d1d5db !important; }
            
            /* Textos */
            .text-slate-100, .text-slate-200 { color: #000000 !important; font-weight: 700 !important; }
            .text-slate-300, .text-slate-400 { color: #1f2937 !important; }
            .text-slate-500 { color: #4b5563 !important; }
            
            /* Cores Específicas de Destaque */
            .text-blue-400, .text-blue-500 { color: #1d4ed8 !important; }
            .text-emerald-400 { color: #15803d !important; }
            .text-orange-400 { color: #b45309 !important; }
            .text-red-400 { color: #b91c1c !important; }
            .text-amber-400 { color: #d97706 !important; } /* Adicionado cor do alerta de Eng */
            
            .border-blue-500 { border-color: #3b82f6 !important; }

            /* Espaçamentos e Fontes Compactas para render mais na folha */
            .p-6 { padding: 1rem !important; }
            .mb-8 { margin-bottom: 1.5rem !important; }
            .gap-6 { gap: 1rem !important; }
            .mt-3 { margin-top: 0.5rem !important; }
            .space-y-2 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.25rem !important; }
            .space-y-1 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.1rem !important; }
            
            .text-xs { font-size: 0.70rem !important; line-height: 1rem !important; }
            .text-\[11px\] { font-size: 0.65rem !important; }
            .text-\[10px\] { font-size: 0.60rem !important; }
            
            /* Ajuste de colunas das secretarias na impressão (Transformando flex em block + float para evitar quebra) */
            .sec-container-print { 
                display: block !important; 
                overflow: hidden !important; 
            }
            .sec-col-left-print { 
                float: left !important; 
                width: 25% !important; 
                border-bottom: none !important; 
                border-right: 1px solid #e5e7eb !important; 
                padding-bottom: 0 !important; 
            }
            .sec-col-right-print { 
                float: left !important; 
                width: 75% !important; 
                padding-left: 1rem !important; 
            }
            
            /* Bordas e linhas de separação */
            .border-slate-700, .border-slate-700\/50 { border-color: #d1d5db !important; }
            
            /* Organização dos itens lado a lado e forçando block para evitar quebra ao meio */
            .grid-print-blocks { display: block !important; }
            .item-pendencia-print {
                display: inline-block !important;
                width: 48% !important;
                vertical-align: top !important;
                margin-bottom: 0.4rem !important;
            }
        }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8 flex flex-col items-center print:p-0 print:m-0">

    <div class="w-full max-w-5xl flex justify-between items-center mb-8 no-print">
        <a href="admin.html" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-medium py-2 px-4 rounded-lg transition border border-slate-700 shadow-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Voltar ao Painel
        </a>
        <button onclick="window.print()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition shadow-md border border-blue-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
            Imprimir / Salvar PDF
        </button>
    </div>

    <!-- Container principal -->
    <main class="w-full max-w-5xl bg-slate-900 rounded-xl p-8 shadow-xl border border-slate-800">
        
        <header class="border-b border-slate-700 pb-6 mb-8 text-center sm:text-left print-break-avoid">
            <h1 class="text-3xl font-black text-slate-100 uppercase tracking-tight print:text-2xl">Relatório Semanal de Emendas</h1>
            <p class="text-slate-400 mt-2 text-lg print:text-base print:mt-1">Posição atualizada extraída diretamente do sistema.</p>
            <div class="mt-4 inline-flex items-center gap-2 px-3 py-1 bg-slate-800 border border-slate-700 rounded-md text-sm font-medium text-blue-400 print:mt-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                Data base: <span id="data-relatorio">Carregando...</span>
            </div>
        </header>

        <div id="loading" class="text-center py-12 no-print">
            <svg class="animate-spin inline-block w-8 h-8 mb-4 text-blue-500" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <p class="text-slate-400">Processando inteligência do relatório...</p>
        </div>

        <!-- Removido o flex e inserido block puro, gerenciando lacunas (gaps) usando margin nativa -->
        <div id="conteudo-relatorio" class="hidden" style="display: block;">
            <!-- Os cards das secretarias serão gerados aqui -->
        </div>
        
        <footer class="mt-12 pt-6 border-t border-slate-700 text-center text-xs text-slate-500 font-mono print-break-avoid">
            Relatório gerado automaticamente pelo Sistema de Gestão de Emendas. Documento estritamente executivo.
        </footer>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAdHnH9Q6c6GqE8mlhBxcNdcEB6n3G7QvU",
            authDomain: "emendas-b63d1.firebaseapp.com",
            projectId: "emendas-b63d1",
            storageBucket: "emendas-b63d1.firebasestorage.app",
            messagingSenderId: "819384266831",
            appId: "1:819384266831:web:d94187838a57bbe0f67a3a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Formata data e hora atual do relatório
        const hoje = new Date();
        const opcoesData = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
        document.getElementById('data-relatorio').textContent = hoje.toLocaleDateString('pt-BR', opcoesData);

        const statusFinais = ["Relatório Final e Arquivamento", "Aprovação Final das Contas"];

        function calcularDiasPassados(dataEtapa) {
            if (!dataEtapa) return 0;
            try {
                const dData = new Date(dataEtapa + "T00:00:00");
                const agora = new Date();
                const diferenca = Math.floor(Math.abs(agora - dData) / (1000 * 60 * 60 * 24));
                return diferenca;
            } catch (e) {
                return 0;
            }
        }

        async function gerarRelatorio() {
            try {
                // Buscando SEMPRE direto do banco para evitar cache estático e falha de dias
                const querySnapshot = await getDocs(collection(db, "emendas"));
                let emendas = [];
                querySnapshot.forEach((doc) => emendas.push({ id: doc.id, ...doc.data() }));

                const secretariasMap = {};

                // Processar cada emenda individualmente
                emendas.forEach(emenda => {
                    const historico = emenda.historico_status || [];
                    const ultimaEtapa = historico.length > 0 ? historico[historico.length - 1] : null;
                    const statusAtual = ultimaEtapa ? ultimaEtapa.status : "Aguardando Início";
                    
                    // Ignora as canceladas
                    if (statusAtual.includes("CANCELADA")) return;

                    const sec = emenda.secretaria || "Sem Secretaria Definida";
                    
                    // Inicializar estrutura da Secretaria
                    if (!secretariasMap[sec]) {
                        secretariasMap[sec] = {
                            total: 0,
                            engenharia: 0,
                            indireta: 0,
                            concluidas: 0,
                            emendasParadas: []
                        };
                    }

                    secretariasMap[sec].total++;

                    if (emenda.projeto_engenharia) secretariasMap[sec].engenharia++;
                    if (emenda.tipo_execucao === "Indireta") secretariasMap[sec].indireta++;
                    
                    if (statusFinais.includes(statusAtual)) {
                        secretariasMap[sec].concluidas++;
                    } else {
                        const dias = calcularDiasPassados(ultimaEtapa ? ultimaEtapa.data : null);
                        let responsavel = "N/I";
                        let usuarioEdicao = "N/I";

                        if(ultimaEtapa) {
                             if(ultimaEtapa.usuario && ultimaEtapa.usuario.includes('@')) {
                                 usuarioEdicao = ultimaEtapa.usuario.split('@')[0];
                             } else if (ultimaEtapa.usuario) {
                                 usuarioEdicao = ultimaEtapa.usuario;
                             }
                             if (ultimaEtapa.responsavel_etapa && ultimaEtapa.responsavel_etapa.trim() !== '') {
                                 responsavel = ultimaEtapa.responsavel_etapa; // Prevalece o nome do campo 'Depto/Responsável'
                             }
                        }
                        
                        secretariasMap[sec].emendasParadas.push({
                            numero: emenda.numero_emenda || "Sem Nº",
                            status: statusAtual,
                            diasParada: dias,
                            resp: responsavel,
                            usuarioEdicao: usuarioEdicao, // <- VARIÁVEL DO USUÁRIO AQUI
                            exigeEng: emenda.projeto_engenharia // NOVA VARIÁVEL
                        });
                    }
                });

                const container = document.getElementById('conteudo-relatorio');
                let htmlContent = '';

                // Ordenar mostrando quem tem a maior bomba de trabalho primeiro (maior total de emendas ativas)
                const secretariasOrdenadas = Object.keys(secretariasMap).sort((a, b) => secretariasMap[b].total - secretariasMap[a].total);

                secretariasOrdenadas.forEach(sec => {
                    const dados = secretariasMap[sec];
                    let textoResumo = '';

                    // Lógica narrativa
                    if (dados.concluidas === dados.total) {
                        textoResumo = `<p class="text-slate-300 leading-relaxed"><span class="text-emerald-400 font-bold">Totalmente Concluído:</span> Todas as emendas desta secretaria foram finalizadas e arquivadas.</p>`;
                    } else {
                        let frases = [];
                        
                        // Peso da Engenharia
                        if (dados.engenharia > 0) {
                            if (dados.engenharia === dados.total) frases.push(`Toda a fila desta Secretaria depende hoje da confecção de <strong>projeto de engenharia</strong> (${dados.engenharia} emendas).`);
                            else frases.push(`Parte considerável depende de <strong>projeto de engenharia</strong> (total de ${dados.engenharia} emendas aguardando liberação de obras).`);
                        }

                        // Peso da burocracia com Entidades
                        if (dados.indireta > 0) {
                            frases.push(`Há <strong>${dados.indireta} emendas</strong> na modalidade Execução Indireta (o avanço depende das entidades parceiras, como a ABOCH ou CPMs).`);
                        }

                        // Concluídas
                        if (dados.concluidas > 0) {
                            frases.push(`O ritmo aponta que <strong>${dados.concluidas} processos já foram integralmente finalizados</strong>.`);
                        }

                        textoResumo = `<div class="text-slate-300 leading-relaxed space-y-2 mb-4 text-sm">${frases.map(f => `<p>• ${f}</p>`).join('')}</div>`;

                        // Lista detalhada dos gargalos
                        if (dados.emendasParadas.length > 0) {
                            // Agrupa a inteligência por status
                            const gargalosAgrupados = {};
                            dados.emendasParadas.forEach(em => {
                                if(!gargalosAgrupados[em.status]) gargalosAgrupados[em.status] = [];
                                gargalosAgrupados[em.status].push(em);
                            });

                            let listaStatusHtml = `<div class="bg-slate-900/50 rounded-lg p-3 border border-slate-700/50 text-xs mt-3 print-break-avoid">
                                <p class="font-bold text-slate-200 mb-2 uppercase tracking-wide">Radar de Pendências (${dados.emendasParadas.length}):</p>
                                <div class="grid-print-blocks">`; // Usa class para lidar na impressao como block puro
                            
                            for(const status in gargalosAgrupados) {
                                listaStatusHtml += `
                                    <div class="border-l-2 border-blue-500 pl-2 print-break-avoid" style="margin-bottom: 0.8rem;">
                                        <p class="font-medium text-slate-300 mb-2 leading-tight">${status} <span class="text-[10px] text-slate-500 font-normal ml-1">(${gargalosAgrupados[status].length} proc.)</span></p>
                                        <div class="grid-print-blocks">
                                `;
                                
                                gargalosAgrupados[status].forEach(em => {
                                    // Cor do crachá do tempo
                                    let colorDias = "text-slate-400";
                                    let fontW = "font-normal";
                                    if(em.diasParada > 10) { colorDias = "text-orange-400"; fontW = "font-bold"; }
                                    if(em.diasParada > 30) { colorDias = "text-red-400"; fontW = "font-black"; }

                                    let responsavelHtml = '';
                                    if (em.resp !== "N/I") {
                                        responsavelHtml = `<span class="text-blue-400 font-semibold truncate max-w-[150px]" title="${em.resp}">Com: ${em.resp}</span>`;
                                    }

                                    // TAG DE PROJETO DE ENGENHARIA AQUI
                                    let badgeEng = em.exigeEng ? `<span class="ml-1 px-1 py-0.5 rounded text-[9px] font-bold bg-amber-900/40 text-amber-400 border border-amber-800/50 print:bg-transparent print:border-none print:p-0" title="Exige Projeto de Engenharia">🏗️ [ENG]</span>` : '';
                                    
                                    // INCLUSÃO DO "Atualizado por" QUE TINHA SUMIDO
                                    let usuarioHtml = em.usuarioEdicao !== "N/I" ? `<span class="text-[10px] text-slate-500 italic ml-1" title="Último usuário a atualizar">Por: ${em.usuarioEdicao}</span>` : '';

                                    // O uso da class item-pendencia-print organiza em grade pra renderizar 2 por linha no A4
                                    listaStatusHtml += `
                                        <div class="flex items-center gap-1.5 text-[11px] text-slate-400 item-pendencia-print">
                                            <span class="w-1.5 h-1.5 rounded-full bg-slate-600 inline-block shrink-0 print:hidden"></span>
                                            <span class="font-mono text-slate-300 whitespace-nowrap">${em.numero}${badgeEng}</span>
                                            <span class="opacity-50">|</span>
                                            <span class="${colorDias} ${fontW} whitespace-nowrap">Há ${em.diasParada} d</span>
                                            <span class="opacity-50">|</span>
                                            ${responsavelHtml}
                                            ${usuarioHtml}
                                        </div>
                                    `;
                                });
                                listaStatusHtml += `</div></div>`;
                            }
                            listaStatusHtml += `</div></div>`;
                            textoResumo += listaStatusHtml;
                        }
                    }

                    // Bloco da Secretaria (Usa display block, e float nas sub divs na impressão para jamais fatiar um card)
                    htmlContent += `
                        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-sm print-break-avoid flex flex-col md:flex-row sec-container-print" style="margin-bottom: 1.5rem;">
                            <!-- Coluna Esquerda: Nome e Número -->
                            <div class="md:w-1/4 shrink-0 border-b md:border-b-0 md:border-r border-slate-700 pb-4 md:pb-0 pr-4 sec-col-left-print">
                                <h2 class="text-xl font-black text-blue-400">${sec}</h2>
                                <div class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-wider">
                                    <span class="text-2xl text-slate-200 leading-none">${dados.total}</span> ativas
                                </div>
                            </div>
                            <!-- Coluna Direita: Dados -->
                            <div class="md:w-3/4 w-full sec-col-right-print">
                                ${textoResumo}
                            </div>
                        </div>
                    `;
                });

                document.getElementById('loading').style.display = 'none';
                container.innerHTML = htmlContent;
                // Exibe o main content block
                container.style.display = 'block'; 

            } catch (error) {
                console.error(error);
                document.getElementById('loading').innerHTML = `<p class="text-red-400">Erro ao carregar e gerar o relatório. Verifique a base de dados.</p>`;
            }
        }

        // Executar a criação logo no carregamento
        gerarRelatorio();
    </script>
</body>
</html>
